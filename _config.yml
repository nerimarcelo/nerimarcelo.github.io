# Tema
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "dark"

# Dados do site
locale: "pt-BR"
title: "A Caverna do Imortal"
title_separator: "-"
subtitle: "As Loucas Aventuras do Marcelo, O Dragão"
name: "Marcelo Neri"
description: "O Grandioso Tio Marcelo, devops e corredor de rua"
url: "https://nerimarcelo.github.io"
baseurl: ""            # deixe vazio se estiver publicando na root
repository: "nerimarcelo/nerimarcelo.github.io"
logo: "/assets/images/7488545.jpg"
masthead_title: ""     # sem título extra na masthead
breadcrumbs: false

# Layout de posts
words_per_minute: 200
enable_copy_code_button: true

# Busca
search: true
search_full_content: true
search_provider: lunr
lunr:
  search_within_pages: false

# Feed ATOM
atom_feed:
  path: feed.xml
  hide: false

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# Inclusões e exclusões
include:
  - .htaccess
  - _pages
  - _posts
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - node_modules
  - log
  - tmp
  - docs
  - test
keep_files:
  - .git

# Internacionalização e encoding
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Processamento de Markdown
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 1..6

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Permalinks e timezone
permalink: /:categories/:title/
timezone: "America/Sao_Paulo"

# Paginação (jekyll-paginate)
paginate: 5
paginate_path: "/page/:num/"

# HTML compression
compress_html:
  clippings: all
  ignore:
    envs: development

# Defaults para posts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true

# Autor
author:
  name: "Marcelo Neri"
  avatar: "/assets/images/7488545.jpg"
  bio: "O Grandioso Tio Marcelo"
  location: "Cuwitaiba"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/nerimarcelo"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/nerimetal"

# Rodapé
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/nerimarcelo"
  since: 2025
